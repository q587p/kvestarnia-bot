name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  BOT_TOKEN: ""
  DATABASE_URL: file:./dev.db

jobs:
  checks:
    name: Foundation checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore ESLint content cache
        uses: actions/cache@v4
        with:
          path: .cache/eslint
          key: ${{ runner.os }}-eslint-${{ hashFiles('package-lock.json', 'eslint.config.cjs', 'tsconfig.eslint.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-eslint-${{ hashFiles('package-lock.json', 'eslint.config.cjs', 'tsconfig.eslint.json') }}-

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Static checks
        run: npm run check:static

      - name: Unit tests
        run: npm run check:unit

      - name: Integration tests
        run: npm run check:integration
